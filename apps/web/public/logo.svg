<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>DevKits animated icon</title>
  <desc>Faceted "D" monogram whose pieces slide together like kit parts assembling, then hold before looping.</desc>
  <defs>
    <linearGradient id="dkGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5CFF"/>
      <stop offset="100%" stop-color="#7DE1FF"/>
    </linearGradient>
    <style>
      .facet-back { animation: backIn 3.2s ease-in-out infinite; }
      .facet-front { animation: frontIn 3.2s ease-in-out infinite; }
      .stem { animation: stemIn 3.2s ease-in-out infinite; }
      .spark { animation: sparkPulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      @keyframes backIn {
        0%   { transform: translate(20px, 20px); opacity: 0; }
        15%  { transform: translate(0, 0); opacity: 1; }
        85%  { transform: translate(0, 0); opacity: 1; }
        100% { transform: translate(20px, 20px); opacity: 0; }
      }
      @keyframes frontIn {
        0%   { transform: translate(-20px, -20px); opacity: 0; }
        25%  { transform: translate(0, 0); opacity: 1; }
        85%  { transform: translate(0, 0); opacity: 1; }
        100% { transform: translate(-20px, -20px); opacity: 0; }
      }
      @keyframes stemIn {
        0%   { transform: translateY(-30px); opacity: 0; }
        35%  { transform: translateY(0); opacity: 1; }
        85%  { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-30px); opacity: 0; }
      }
      @keyframes sparkPulse {
        0%, 35%  { transform: rotate(45deg) scale(0); opacity: 0; }
        45%      { transform: rotate(45deg) scale(1.3); opacity: 1; }
        55%      { transform: rotate(45deg) scale(1); opacity: 1; }
        75%      { transform: rotate(225deg) scale(1.15); opacity: 1; }
        85%, 100% { transform: rotate(225deg) scale(0); opacity: 0; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="#060B1A"/>

  <polygon class="facet-back" points="90,58 140,58 164,88 164,132 140,162 90,162" fill="#14224D"/>
  <polygon class="facet-front" points="80,48 130,48 154,78 154,122 130,152 80,152" fill="url(#dkGradA)" stroke="#BFE8FF" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect class="stem" x="60" y="50" width="22" height="100" rx="6" fill="#F4F7FF"/>
  <rect class="spark" x="145" y="49" width="14" height="14" rx="2" fill="#7DE1FF"/>
</svg>
